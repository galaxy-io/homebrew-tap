name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # The next three steps are what `brew test-bot --only-tap-syntax` runs,
      # spelled out so flags can be passed:
      # - Style runs on one runner only. It is platform-independent, and
      #   `brew style` installs actionlint and shellcheck to lint the workflows.
      # - `sha256_no_check_if_unversioned` is skipped because GoReleaser writes
      #   literal download URLs. Every URL is pinned to a release tag and has a
      #   real sha256.
      - run: brew style galaxy-io/tap
        if: matrix.os == 'ubuntu-24.04'
      - run: brew readall --aliases --os=all --arch=all galaxy-io/tap
      - run: brew audit --except=installed,sha256_no_check_if_unversioned --tap=galaxy-io/tap

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
